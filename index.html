<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantouvert</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- NAVIGATION -->
  <header class="site-header" data-header>
    <nav class="nav container">
      <button class="nav__toggle" aria-label="Open menu" aria-expanded="false">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
      <a href="index.html" class="nav__logo">Mantouvert</a>
    </nav>
    <div class="nav__menu">
      <ul class="nav__links">
        <li><a href="index.html" class="nav__link is-active">Home</a></li>
        <li><a href="projects.html" class="nav__link">Projects</a></li>
        <li><a href="services.html" class="nav__link">Services</a></li>
        <li><a href="about.html" class="nav__link">About</a></li>
        <li><a href="contact.html" class="nav__link nav__link--cta">Request a Quote</a></li>
      </ul>
    </div>
  </header>

  <main>
    <!-- HERO CARDS -->
    <section class="hero hero--cards">
      <div class="hero-cards">
        <!-- Row 1 -->
        <div class="hero-card">
          <div class="hero-card__media">
            <img src="public/imgs/hero_garden.jpg" alt="Garden Design">
          </div>
          <div class="hero-card__overlay"></div>
          <div class="hero-card__content">
            <span class="hero-card__number">01</span>
            <h2 class="hero-card__title">Garden<br>Design</h2>
          </div>
        </div>

        <div class="hero-card">
          <div class="hero-card__media">
            <img src="public/imgs/hero_swimmingpool.jpg" alt="Swimming Pools">
          </div>
          <div class="hero-card__overlay"></div>
          <div class="hero-card__content">
            <span class="hero-card__number">02</span>
            <h2 class="hero-card__title">Swimming<br>Pools</h2>
          </div>
        </div>

        <div class="hero-card">
          <div class="hero-card__media">
            <img src="public/imgs/hero_waterfall.jpg" alt="Water Features">
          </div>
          <div class="hero-card__overlay"></div>
          <div class="hero-card__content">
            <span class="hero-card__number">03</span>
            <h2 class="hero-card__title">Water<br>Features</h2>
          </div>
        </div>

        <div class="hero-card">
          <div class="hero-card__media">
            <img src="public/imgs/hero_garden.jpg" alt="Outdoor Living">
          </div>
          <div class="hero-card__overlay"></div>
          <div class="hero-card__content">
            <span class="hero-card__number">04</span>
            <h2 class="hero-card__title">Outdoor<br>Living</h2>
          </div>
        </div>

        <!-- Row 2 -->
        <div class="hero-card">
          <div class="hero-card__media">
            <img src="public/imgs/hero_swimmingpool.jpg" alt="Landscaping">
          </div>
          <div class="hero-card__overlay"></div>
          <div class="hero-card__content">
            <span class="hero-card__number">05</span>
            <h2 class="hero-card__title">Landscaping</h2>
          </div>
        </div>

        <div class="hero-card">
          <div class="hero-card__media">
            <img src="public/imgs/hero_waterfall.jpg" alt="Hardscaping">
          </div>
          <div class="hero-card__overlay"></div>
          <div class="hero-card__content">
            <span class="hero-card__number">06</span>
            <h2 class="hero-card__title">Hardscaping</h2>
          </div>
        </div>

        <div class="hero-card">
          <div class="hero-card__media">
            <img src="public/imgs/hero_garden.jpg" alt="Irrigation">
          </div>
          <div class="hero-card__overlay"></div>
          <div class="hero-card__content">
            <span class="hero-card__number">07</span>
            <h2 class="hero-card__title">Irrigation</h2>
          </div>
        </div>

        <div class="hero-card">
          <div class="hero-card__media">
            <img src="public/imgs/hero_swimmingpool.jpg" alt="Maintenance">
          </div>
          <div class="hero-card__overlay"></div>
          <div class="hero-card__content">
            <span class="hero-card__number">08</span>
            <h2 class="hero-card__title">Maintenance</h2>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>

</html>
