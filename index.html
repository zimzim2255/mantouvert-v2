<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantouvert</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- NAVIGATION -->
  <header class="site-header" data-header>
    <nav class="nav container">
      <button class="nav__toggle" aria-label="Open menu" aria-expanded="false">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
      <a href="index.html" class="nav__logo">Mantouvert</a>
    </nav>
    <div class="nav__menu">
      <ul class="nav__links">
        <li><a href="index.html" class="nav__link is-active">Home</a></li>
        <li><a href="projects.html" class="nav__link">Projects</a></li>
        <li><a href="services.html" class="nav__link">Services</a></li>
        <li><a href="about.html" class="nav__link">About</a></li>
        <li><a href="contact.html" class="nav__link nav__link--cta">Request a Quote</a></li>
      </ul>
    </div>
  </header>

  <main>
    <!-- HERO CARDS -->
    <section class="hero hero--cards">
      <!-- Shared background: 3 images side by side -->
      <div class="hero-cards__bg">
        <img src="public/imgs/hero_garden.jpg" alt="">
        <img src="public/imgs/hero_swimmingpool.jpg" alt="">
        <img src="public/imgs/hero_waterfall.jpg" alt="">
        <div class="hero-cards__shade"></div>
      </div>

      <div class="hero-cards">
        <!-- Row 1 -->
        <div class="hero-card"></div>
        <div class="hero-card"></div>
        <div class="hero-card"></div>
        <div class="hero-card"></div>

        <!-- Row 2 -->
        <div class="hero-card"></div>
        <div class="hero-card">
          <h3 class="hero-card__header">Hardscaping</h3>
        </div>
        <div class="hero-card">
          <h3 class="hero-card__header">Irrigation</h3>
        </div>
        <div class="hero-card">
          <h3 class="hero-card__header">Maintenance</h3>
        </div>
      </div>

      <!-- Bottom hero text -->
      <div class="hero-cards__footer">
        <h1 class="hero-cards__headline">Always for the smile</h1>
        <p class="hero-cards__paragraph">Experience comfort with a conscience. Our eco-friendly underwear is designed for ultimate softness and all-day wear, crafted from sustainable materials.</p>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
